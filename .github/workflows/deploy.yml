name: Build, Push to Docker Hub & Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/chatbot_v1:latest

  deploy-to-vps:
    name: Deploy to VPS via SSH
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Execute Deploy Script on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # 1. Đi vào thư mục chứa docker-compose trên VPS
            mkdir -p ~/yuikiri/chatbot_v1/data/documents ~/yuikiri/chatbot_v1/data/index
            cd ~/yuikiri/chatbot_v1

            # 2. Kéo image mới nhất từ Docker Hub về
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/chatbot_v1:latest

            # 3. Khởi động lại container với image mới
            docker compose down || true
            docker compose up -d

            # 4. Xóa các image cũ không còn dùng (giải phóng dung lượng ổ cứng VPS)
            docker image prune -f
