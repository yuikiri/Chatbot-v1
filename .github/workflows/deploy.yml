name: Build, Push to Docker Hub & Deploy Chatbot v1 to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/chatbot_v1:latest

  deploy-to-vps:
    name: Deploy to VPS via SSH
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Execute Deploy Script on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || secrets.HOST }}
          username: ${{ secrets.VPS_USERNAME || secrets.USERNAME || 'yuikiri' }}
          password: ${{ secrets.VPS_PASSWORD || secrets.PASSWORD || secrets.VPS_PASS }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_KEY || '' }}
          port: ${{ secrets.VPS_PORT || secrets.PORT || 22 }}
          script: |
            cd ~/yuikiri/chatbot_v1 || exit 1

            # Đăng nhập Docker Hub nếu image ở chế độ private
            if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            fi

            # Nhận diện lệnh compose trên CentOS 8 (hỗ trợ cả 'docker compose' v2 và 'docker-compose' v1)
            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi

            # 1. Kéo duy nhất image mới của chatbot từ Docker Hub về
            $DC pull chatbot-app

            # 2. Khởi động lại duy nhất container chatbot-app mà không ảnh hưởng bất kỳ container nào khác
            $DC up -d --no-deps chatbot-app
