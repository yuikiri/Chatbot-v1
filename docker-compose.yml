services:
  chatbot-app:
    image: ${DOCKER_IMAGE:-yuikiri/chatbot_v1:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot_v1_app
    restart: unless-stopped
    ports:
      - "${PORT:-10000}:10000"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - PORT=10000
      - ASPNETCORE_URLS=http://+:10000
      - LLM__Provider=${LLM_PROVIDER:-gemini}
      - LLM__BaseUrl=${LLM_BASE_URL:-https://generativelanguage.googleapis.com}
      - LLM__ApiKey=${LLM_API_KEY:-}
      - LLM__Model=${LLM_MODEL:-gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-flash-lite}
      - LLM__EmbeddingModel=${LLM_EMBEDDING_MODEL:-gemini-embedding-001,gemini-embedding-002}
      - Admin__SecretKey=${ADMIN_SECRET_KEY:-123123123}
      - Storage__DocumentsPath=/app/storage/documents
      - Storage__DbPath=/app/storage/index/knowledge.db
      - VECTOR_STORE_PROVIDER=${VECTOR_STORE_PROVIDER:-qdrant}
      - QDRANT_ENDPOINT=${QDRANT_ENDPOINT:-}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-medical_knowledge}
      - QDRANT_VECTOR_SIZE=${QDRANT_VECTOR_SIZE:-3072}
    volumes:
      - chatbot_documents:/app/storage/documents
      - chatbot_index:/app/storage/index
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Dịch vụ Qdrant Vector Database chạy cục bộ (tùy chọn)
  # Kích hoạt khi không dùng Qdrant Cloud bằng lệnh:
  # docker compose --profile local-qdrant up -d
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: chatbot_v1_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_local_data:/qdrant/storage
    profiles:
      - local-qdrant

volumes:
  chatbot_documents:
  chatbot_index:
  qdrant_local_data:
